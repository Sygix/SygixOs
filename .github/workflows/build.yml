name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug test --no-daemon
      - name: UI screenshots (Roborazzi)
        run: ./gradlew testDebugUnitTest -Proborazzi.test.record=true --no-daemon || true
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/outputs/screenshots/
      - name: Comment PR with artifacts
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `📦 **Artifacts de test** : [app-debug.apk](${runUrl}#artifacts) + screenshots — [page du run](${runUrl})`,
            });
