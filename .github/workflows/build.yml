name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
      # Pas d'assembleDebug ici : le build se fait en local avant chaque push,
      # la CI ne build que pour la release (workflow release.yml sur tag).
      - run: ./gradlew test --no-daemon
      - name: Test results in PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'app/build/test-results/testDebugUnitTest/TEST-*.xml'
          require_tests: true
          annotate_notice: false
