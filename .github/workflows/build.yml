name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle assembleDebug test --no-daemon
      - name: UI screenshots (Roborazzi)
        run: gradle testDebugUnitTest -Proborazzi.test.record=true --no-daemon || true
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/screenshots/
