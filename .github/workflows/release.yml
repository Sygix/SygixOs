name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: echo "${{ secrets.SYGIXOS_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          SYGIXOS_VERSION: ${{ github.ref_name }}
          SYGIXOS_STORE_FILE: ${{ runner.temp }}/release.keystore
          SYGIXOS_STORE_PASSWORD: ${{ secrets.SYGIXOS_STORE_PASSWORD }}
          SYGIXOS_KEY_ALIAS: ${{ secrets.SYGIXOS_KEY_ALIAS }}
          SYGIXOS_KEY_PASSWORD: ${{ secrets.SYGIXOS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease test --no-daemon

      # Vérifie que l'APK est bien signé avec la clé release (et non debug) avant publication.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
