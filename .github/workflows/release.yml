name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | android sdk --licenses
          android sdk 'platforms;android-37.0' 'build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-disabled: true

      - name: Decode keystore
        env:
          SYGIXOS_KEYSTORE_BASE64: ${{ secrets.SYGIXOS_KEYSTORE_BASE64 }}
          SYGIXOS_STORE_PASSWORD: ${{ secrets.SYGIXOS_STORE_PASSWORD }}
          SYGIXOS_KEY_ALIAS: ${{ secrets.SYGIXOS_KEY_ALIAS }}
          SYGIXOS_KEY_PASSWORD: ${{ secrets.SYGIXOS_KEY_PASSWORD }}
        run: |
          for name in SYGIXOS_KEYSTORE_BASE64 SYGIXOS_STORE_PASSWORD SYGIXOS_KEY_ALIAS SYGIXOS_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Secret $name manquant"; exit 1; }
          done
          echo "$SYGIXOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          SYGIXOS_VERSION: ${{ github.ref_name }}
          SYGIXOS_STORE_FILE: ${{ runner.temp }}/release.keystore
          SYGIXOS_STORE_PASSWORD: ${{ secrets.SYGIXOS_STORE_PASSWORD }}
          SYGIXOS_KEY_ALIAS: ${{ secrets.SYGIXOS_KEY_ALIAS }}
          SYGIXOS_KEY_PASSWORD: ${{ secrets.SYGIXOS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease dexMetadataRelease test --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Verify startup profile
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          DM=app/build/outputs/dexmetadata/release/app-release.dm
          [ "$(unzip -Z1 "$DM" | sort | tr '\n' ' ')" = "primary.prof primary.profm " ] || { echo "::error::app-release.dm must hold primary.prof and primary.profm only"; exit 1; }
          cmp <(unzip -p "$DM" primary.profm) <(unzip -p "$APK" assets/dexopt/baseline.profm)

      - name: Stage release files
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/dexmetadata/release/app-release.dm "$RUNNER_TEMP/dist/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-release
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name app-release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          case "$state" in
            missing) gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG" --prerelease="$PRERELEASE" ;;
            true) ;;
            *) echo "::error::Release $TAG is already published"; exit 1 ;;
          esac
          gh release upload "$TAG" app-release.apk app-release.dm --clobber
          gh release edit "$TAG" --draft=false
