[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
datastore = "1.2.1"
media3 = "1.11.1"
coil = "2.7.0"
junit = "4.13.2"
roborazzi = "1.75.0"
